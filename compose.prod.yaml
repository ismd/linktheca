services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: linktheca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: linktheca
    volumes:
      - linktheca_pg_data:/var/lib/postgresql

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    restart: unless-stopped
    command:
      - --model-id=BAAI/bge-m3
      - --port=8080
      - --max-batch-tokens=1024
      - --tokenization-workers=2
    mem_limit: 4g
    volumes:
      - linktheca_tei_data:/data

  backend:
    image: ghcr.io/ismd/linktheca-backend:${LINKTHECA_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - postgres
      - tei
    environment:
      LINKTHECA_DB_DSN: postgres://linktheca:${POSTGRES_PASSWORD}@postgres:5432/linktheca?sslmode=disable
      LINKTHECA_JWT_SECRET: ${JWT_SECRET:?required}
      LINKTHECA_JWT_ACCESS_TTL: ${LINKTHECA_JWT_ACCESS_TTL:-15m}
      LINKTHECA_JWT_REFRESH_TTL: ${LINKTHECA_JWT_REFRESH_TTL:-720h}
      LINKTHECA_TEI_URL: http://tei:8080
      LINKTHECA_TEI_TIMEOUT: ${LINKTHECA_TEI_TIMEOUT:-30s}
      LINKTHECA_LOG_FORMAT: ${LINKTHECA_LOG_FORMAT:-json}
      LINKTHECA_LOG_LEVEL: ${LINKTHECA_LOG_LEVEL:-info}
      LINKTHECA_REGISTRATION_ENABLED: ${LINKTHECA_REGISTRATION_ENABLED:-true}
      LINKTHECA_RADAR_ENABLED: ${LINKTHECA_RADAR_ENABLED:-true}
      LINKTHECA_RADAR_SCHEDULER_INTERVAL: ${LINKTHECA_RADAR_SCHEDULER_INTERVAL:-5m}
      LINKTHECA_RADAR_MAX_WORKERS: ${LINKTHECA_RADAR_MAX_WORKERS:-5}
      LINKTHECA_CORS_ORIGINS: ${LINKTHECA_CORS_ORIGINS:-}
      # Fixed on purpose: the web service serves this volume as static files,
      # so the path cannot be changed on one side only.
      LINKTHECA_MEDIA_DIR: /data/media
    volumes:
      - linktheca_media:/data/media
    expose:
      - "8080"

  web:
    image: ghcr.io/ismd/linktheca-web:${LINKTHECA_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - linktheca_media:/srv/media:ro
    # Bound to loopback only; a host reverse proxy (Caddy) terminates TLS and
    # proxies here. Use "80:80" instead to expose the app directly over HTTP.
    ports:
      - "127.0.0.1:8080:80"

volumes:
  linktheca_pg_data:
  linktheca_tei_data:
  linktheca_media:
