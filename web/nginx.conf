server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        set $backend_upstream http://backend:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Downloaded assets, written by the backend into the shared linktheca_media
    # volume. Served straight from disk, so these requests never reach the
    # backend. Image names are random and never reused, hence immutable; favicon
    # names are the site's host and their content can change, hence a plain expiry.
    location /media/images/ {
        alias /srv/media/images/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/favicons/ {
        alias /srv/media/favicons/;
        try_files $uri =404;
        expires 1d;
        access_log off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
