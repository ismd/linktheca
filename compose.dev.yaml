services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: linktheca
      POSTGRES_PASSWORD: linktheca
      POSTGRES_DB: linktheca
    ports:
      - "5432:5432"
    volumes:
      - linktheca_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linktheca -d linktheca"]
      interval: 5s
      timeout: 5s
      retries: 5

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command:
      - --model-id=BAAI/bge-m3
      - --port=8080
      - --max-batch-tokens=1024
      - --tokenization-workers=2
    ports:
      - "8081:8080"
    volumes:
      - linktheca_tei_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

volumes:
  linktheca_pg_data:
  linktheca_tei_data:
